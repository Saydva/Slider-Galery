<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style/main.css" />
    <title>Galéria obrázkov</title>
  </head>
  <body>
    <!-- SLIDER -->
    <div class="slider-wrapper" data-slider="gallery1">
      <div class="theme-buttons">
        <button class="theme-btn button-theme" data-theme="light">
          Svetlá téma
        </button>
        <button class="theme-btn button-theme" data-theme="dark">
          Tmavá téma
        </button>
        <button class="theme-btn button-theme" data-theme="neutral">
          Neutrálna téma
        </button>
        <button class="theme-btn button-theme" data-theme="default">
          Default téma
        </button>
      </div>
      <div class="main-container">
        <div class="button-container">
          <button class="button prev-btn">&#10094;</button>
        </div>
        <div class="img-container"></div>
        <div class="button-container">
          <button class="button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- SLIDER -->
    <div class="slider-wrapper" data-slider="gallery2">
      <div class="theme-buttons">
        <button class="theme-btn button-theme" data-theme="light">
          Svetlá téma
        </button>
        <button class="theme-btn button-theme" data-theme="dark">
          Tmavá téma
        </button>
        <button class="theme-btn button-theme" data-theme="neutral">
          Neutrálna téma
        </button>
        <button class="theme-btn button-theme" data-theme="default">
          Default téma
        </button>
      </div>
      <div class="main-container">
        <div class="button-container">
          <button class="button prev-btn">&#10094;</button>
        </div>
        <div class="img-container"></div>
        <div class="button-container">
          <button class="button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- TRETÍ -->
    <div class="slider-wrapper" data-slider="gallery3">
      <div class="theme-buttons">
        <button class="theme-btn button-theme" data-theme="light">
          Svetlá téma
        </button>
        <button class="theme-btn button-theme" data-theme="dark">
          Tmavá téma
        </button>
        <button class="theme-btn button-theme" data-theme="neutral">
          Neutrálna téma
        </button>
        <button class="theme-btn button-theme" data-theme="default">
          Default téma
        </button>
      </div>
      <div class="main-container">
        <div class="button-container">
          <button class="button prev-btn">&#10094;</button>
        </div>
        <div class="img-container"></div>
        <div class="button-container">
          <button class="button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="Zväčšený obrázok" />
      </div>
    </div>

    <script type="module" src="./src/scripts/main.js"></script>
  </body>
</html>

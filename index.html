<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style/main.css" />
    <link rel="stylesheet" href="./src/style/responsive.css" />
    <title>Galéria obrázkov</title>
  </head>
  <body>
    <!-- SLIDER -->
    <div class="slider-wrapper slider1-wrapper" data-slider="gallery1">
      <div class="theme-buttons">
        <button class="theme-btn button-theme" data-theme="forest">
          Forest
        </button>
        <button class="theme-btn button-theme" data-theme="pastel">
          Pastel
        </button>
        <button class="theme-btn button-theme" data-theme="retro">Retro</button>
        <button class="theme-btn button-theme" data-theme="default">
          Default
        </button>
      </div>
      <div class="main-container slider1-main-container">
        <div class="button-container slider1-button-container">
          <button class="button slider1-button prev-btn">&#10094;</button>
        </div>
        <div class="img-container slider1-img-container"></div>
        <div class="button-container slider1-button-container">
          <button class="button slider1-button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- SLIDER -->
    <div class="slider-wrapper slider2-wrapper" data-slider="gallery2">
      <div class="theme-buttons slider2-theme-buttons">
        <button class="theme-btn button-theme" data-theme="vibrant">
          Vibrant
        </button>
        <button class="theme-btn button-theme" data-theme="sand">Sand</button>
        <button class="theme-btn button-theme" data-theme="dusk">Dusk</button>
        <button class="theme-btn button-theme" data-theme="default">
          Default
        </button>
      </div>
      <div class="main-container slider2-main-container">
        <div class="button-container slider2-button-container">
          <button class="button slider2-button prev-btn">&#10094;</button>
        </div>
        <div class="img-container slider2-img-container"></div>
        <div class="button-container slider2-button-container">
          <button class="button slider2-button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- SLIDER 3 -->
    <div class="slider-wrapper slider3-wrapper" data-slider="gallery3">
      <div class="theme-buttons slider3-theme-buttons">
        <button class="theme-btn button-theme" data-theme="aqua">Aqua</button>
        <button class="theme-btn button-theme" data-theme="ocean">Ocean</button>
        <button class="theme-btn button-theme" data-theme="rose">Rose</button>
        <button class="theme-btn button-theme" data-theme="default">
          Default
        </button>
      </div>
      <div class="main-container slider3-main-container">
        <div class="button-container slider3-button-container">
          <button class="button slider3-button prev-btn">&#10094;</button>
        </div>
        <div class="img-container slider3-img-container"></div>
        <div class="button-container slider3-button-container">
          <button class="button slider3-button next-btn">&#10095;</button>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="Zväčšený obrázok" />
      </div>
    </div>

    <script type="module" src="./src/scripts/main.js"></script>
  </body>
</html>
